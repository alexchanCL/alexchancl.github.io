<!DOCTYPE HTML>
<html lang="{{ site.lang | default: 'en-US' }}">
	<head>
		<title>404 Not Found</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

        <link rel="icon" media="(prefers-color-scheme:dark)" href="{{ site.favicon_dark | relative_url }}" type="image/x-icon" />
        <link rel="icon" media="(prefers-color-scheme:light)" href="{{ site.favicon | relative_url }}" type="image/x-icon" />
        <script src="{{ '/assets/js/favicon-switcher.js' | relative_url }}" type="application/javascript"></script>

        <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">



	</head>
	<body class="is-preload">

		<!-- Main -->
			<div class="wrapper" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center;">

					<section style="width: auto; float: none; padding: 20px;">
                    <h1><strong>404 Not Found</strong></h1>
                    <br>
					<h3>This is not the web page you are looking for.</h3>
                    <br>
					<h3>You'll be redirected to the homepage in 5 seconds.</h3>

					<script>
					window.setTimeout(function () {
						window.location.href = "{{ '/' | relative_url }}";
					}, 5000);
					</script>
                  </section>

			</div>

		<!-- Scripts -->
        <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>

	</body>
</html>
